# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zspacemanager
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true
        target:
          url: https://10.123.1.11:44300
          client: '100'
        app:
          name: ZSPACEMANAGER
          description: Space Manager
          package: ZDAC_HR
          transport: MD4K915580
        exclude:
          - /test/
